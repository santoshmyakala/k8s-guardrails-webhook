apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - rbac.yaml
  - certificate.yaml
  - deployment.yaml
  - webhook.yaml
# A policy change gets a new ConfigMap name, which rolls the Deployment.
configMapGenerator:
  - name: guardrails-policy
    namespace: guardrails-system
    files: [policy.yaml]
images:
  - name: guardrails-webhook
    newName: ghcr.io/santoshmyakala/k8s-guardrails-webhook
    newTag: main # release overlays pin a digest instead
