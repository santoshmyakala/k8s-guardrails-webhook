version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule: { interval: weekly }
    groups:
      kubernetes: { patterns: ["k8s.io/*", "sigs.k8s.io/*"] }
    cooldown:
      default-days: 7
  - package-ecosystem: docker
    directory: "/"
    schedule: { interval: weekly }
    cooldown:
      default-days: 7
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly }
    cooldown:
      default-days: 7
